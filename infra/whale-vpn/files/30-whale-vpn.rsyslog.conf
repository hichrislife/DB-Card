# Whale VPN：把 nftables 的連線紀錄從 kernel log 分流到 /var/log/whale-vpn/
# 使用 RSYSLOG_FileFormat（RFC 3339，含時區、微秒）
:msg, contains, "whale-vpn-ssh: " action(type="omfile" file="/var/log/whale-vpn/ssh-connections.log" template="RSYSLOG_FileFormat")
& stop
:msg, contains, "whale-vpn-fwd-drop: " action(type="omfile" file="/var/log/whale-vpn/forward-drops.log" template="RSYSLOG_FileFormat")
& stop
