# Whale 遠端維護 VPN：工程師筆電設定範本
# 1. 在筆電上產生金鑰（macOS WireGuard App：「新增空白通道」會自動產生；
#    或指令 `wg genkey | tee laptop.key | wg pubkey`）。私鑰不離開筆電。
# 2. 把「公鑰」交給 VPN 管理員，管理員執行：
#      sudo whale-vpn-peer add engineer <名稱> <公鑰> --note "<使用者／設備>"
#    取得分配的 10.8.1.N。
# 3. 填入下面三個 <...> 後匯入 WireGuard。

[Interface]
PrivateKey = <筆電自己的私鑰>
Address = <10.8.1.N>/32
# 不設 DNS：VPN 只用來連機器的 IP

[Peer]
PublicKey = <伺服器公鑰：sudo cat /etc/wireguard/server.pub>
Endpoint = vpn.whaleforensics.com:51820
# 只有機器網段走 VPN（split tunnel），其他流量照常
AllowedIPs = 10.8.0.0/24
PersistentKeepalive = 25

# 連機器（只開 TCP 22；ping 不會通是正常的）：
#   ssh -o CertificateFile=~/.ssh/id_ed25519-cert.pub <帳號>@10.8.0.N
# 憑證由工程師 CA 簽發，與這台 VPN 伺服器無關。
