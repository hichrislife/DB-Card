# Keel Edge 3／Mini 3 機器端 WireGuard 設定（給產品端對齊用的參考值）
# 機器安裝時自己產生金鑰並顯示公鑰，管理員以
#   sudo whale-vpn-peer add machine <名稱> <公鑰> --note "<客戶機關／序號>"
# 登錄後取得 10.8.0.N。也可在伺服器上用 whale-vpn-peer show-config <名稱> 印出填好的版本。

[Interface]
PrivateKey = <機器自己的私鑰>
Address = <10.8.0.N>/32

[Peer]
PublicKey = <伺服器公鑰>
Endpoint = vpn.whaleforensics.com:51820
# 必須包含工程師網段 10.8.1.0/24：工程師 SSH 封包的來源是 10.8.1.x，
# 不在 AllowedIPs 內的來源會被機器端 WireGuard 直接丟掉。
# 不要設 0.0.0.0/0：機器不經 VPN 上網（伺服器端也會擋）。
AllowedIPs = 10.8.0.1/32, 10.8.1.0/24
# 機器在客戶 NAT／防火牆後面，靠 keepalive 維持通道，工程師才連得進來
PersistentKeepalive = 25
