# 部署設定檔：一般（企業／個人）
profile: general
description: 預設離線，可選配線上同步；雲端老師使用 Anthropic API。

base_model:
  allowed: [Qwen3-8B, Qwen3-14B, Llama-3.1-TAIDE-LX-8B-Chat, gemma-3-12b-it-qat]
  selected: Qwen3-14B
  quant: Q4_K_M

small_models:                               # 配置 B：14B 佔主卡，小模型改 CPU
  device: cpu
  runtime: onnxruntime-int8
  threads: 20
  embedding: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  nli: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  # 若改選 8B 基底，把 device 改為 cuda:0 即切回配置 A

npu:
  vendor: deepx
  device: DX-M1
  runtime: dx-rt
  service: grpc://127.0.0.1:50061
  tools: [vision.layout, vision.ocr_detect, vision.table_seal, vision.redact_faces, vision.kiosk]
  calibration_dataset: data/npu-calib/
  llm_side_models_allowed: false
  fallback_on_unhealthy: cpu_layout

audio:
  stt: faster-whisper-small-int8
  vad: silero-vad

network:
  online_sync: optional                     # 有網路時可直接同步，隨身碟為備援
  usb_only: false

teacher:
  kind: claude                              # ClaudeTeacher
  model: claude-opus-5-5
  use_batches: true                         # Message Batches，成本減半
  structured_output: true                   # 每筆合成問答必帶 source_chunk_id

export_policy:
  include_document_content: true
  excluded_classifications: [secret]
  pii_redaction: regex+ner
  require_admin_approval: false

module_governance:
  low_risk_editable_by: [user, admin]
  high_risk_editable_by: [admin]
  record_approvals: true

output:
  disclosure_notice: null
  show_sources_inline: true

audit:
  retention_years: 1
  append_only: true
  hash_chain: false

verifier_policy: verifier.policy.example.yaml   # 兩個設定檔共用，不可放寬
